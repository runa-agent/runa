site_name: Runa
site_description: The application framework for agentic AI.
site_url: https://benybrahim.github.io/runa/
repo_name: Benybrahim/runa
repo_url: https://github.com/Benybrahim/runa
edit_uri: edit/main/docs/

copyright: Copyright &copy; Runa contributors

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/svg/runa-mark-blue.svg
  favicon: assets/favicon/favicon.ico
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tooltips

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - Guides: guides.md
  - Examples: examples.md
  - Core Concepts:
      - Agents: agents.md
      - Tools: tools.md
      - Guardrails: guardrails.md
      - Subagents: subagents.md
  - Running Agents:
      - Sessions and Chat: sessions.md
      - Memory: memory.md
      - Knowledge: knowledge.md
      - Cache: cache.md
      - MCP Servers: mcp.md
      - Human Approval: approval.md
  - Evaluation:
      - Evaluation: evaluation.md
  - Observability: tracing.md
  - Reference:
      - Model Providers: models.md
      - CLI Reference: cli.md
      - API Reference: api.md

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_bases: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            members_order: source
            summary: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Benybrahim/runa
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/runa/
