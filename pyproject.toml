[project]
name = "runa-ai"
version = "0.3.0"
authors = [
    { name = "Brahim Benyous" },
]
description = "The application framework for agentic AI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.75.0",
    "graphviz>=0.21",
    "httpx2>=2.12.0",
    "mcp>=2.1.1",
    "pydantic>=2.9.0",
    "pypdf>=6.0.0",
    "sqlite-vec>=0.1.9",
    "zensical>=0.0.61",
]

[project.optional-dependencies]
langfuse = ["opentelemetry-exporter-otlp-proto-http>=1.27.0", "opentelemetry-sdk>=1.27.0"]
postgres = ["asyncpg>=0.30.0", "pgvector>=0.3.6"]
redis = ["redis>=5.2.0"]
ui = ["fastapi>=0.121.0", "uvicorn>=0.38.0"]

[project.scripts]
runa = "runa.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "pyright>=1.1.400",
    "python-dotenv>=1.2.3",
    "httpx>=0.28.0",
    "runa-ai[langfuse,postgres,redis,ui]",
    "mkdocstrings-python>=2.0.8",
]

[build-system]
requires = ["uv_build >= 0.12.10, <0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "runa"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
# `ruff format` also reformats fenced ```python blocks inside Markdown files, which mangles
# pymdownx.snippets' `--8<--` include marker (docs/*.md) into invalid syntax. Docs prose isn't
# ruff's to format anyway, so it's excluded outright rather than worked around per line.
extend-exclude = ["docs/**/*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "D",   # docstring
]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyright]
include = ["src", "tests", "examples"]
reportIncompatibleMethodOverride = false
